<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Arjeet Anand — AI/ML Engineer at Oracle</title>
  <desc id="desc">A dark, high-contrast banner with a connected AI systems diagram and the themes GenAI, hybrid RAG, agent systems, and data.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D18"/>
      <stop offset="0.58" stop-color="#10182B"/>
      <stop offset="1" stop-color="#17172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C74634"/>
      <stop offset="0.53" stop-color="#FF6B55"/>
      <stop offset="1" stop-color="#5BD8F5"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7665"/>
      <stop offset="1" stop-color="#62DDF5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#91A7CB" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C74634" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#C74634" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="26" fill="url(#background)" stroke="#2A3650" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="336" rx="25" fill="url(#grid)"/>
  <circle cx="1075" cy="166" r="245" fill="url(#glow)"/>

  <rect x="56" y="52" width="72" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="56" y="91" fill="#9FB1CC" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">APPLIED AI  /  ORACLE</text>
  <text x="52" y="166" fill="#F4F7FC" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="800" letter-spacing="-2">Arjeet Anand</text>
  <text x="56" y="211" fill="#F4F7FC" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="1.3">AI/ML ENGINEER <tspan fill="#FF7665">AT ORACLE</tspan></text>
  <text x="56" y="270" fill="#AAB8CE" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="1.2">GENAI  ·  HYBRID RAG  ·  AGENT SYSTEMS  ·  DATA</text>

  <rect x="760" y="45" width="385" height="250" rx="22" fill="#0D1424" fill-opacity="0.82" stroke="#31415D" stroke-width="1.5"/>
  <text x="790" y="79" fill="#9FB1CC" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">SYSTEMS THAT CONNECT</text>

  <g fill="none" stroke="url(#line)" stroke-opacity="0.7" stroke-width="2">
    <path d="M866 132L939 166L1038 123"/>
    <path d="M866 132L866 220L939 166"/>
    <path d="M939 166L1039 221L1038 123"/>
    <path d="M939 166L1093 166" stroke-opacity="0.42"/>
  </g>
  <g fill="#111E33" stroke="#58708F" stroke-width="1.5">
    <rect x="793" y="111" width="94" height="42" rx="12"/>
    <rect x="991" y="102" width="96" height="42" rx="12"/>
    <rect x="793" y="199" width="94" height="42" rx="12"/>
    <rect x="991" y="200" width="96" height="42" rx="12"/>
    <rect x="1048" y="145" width="76" height="42" rx="12" stroke="#C74634"/>
  </g>
  <g fill="#DFE8F5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">
    <text x="840" y="137">DATA</text>
    <text x="1039" y="128">RETRIEVAL</text>
    <text x="840" y="225">AGENTS</text>
    <text x="1039" y="226">TOOLS</text>
    <text x="1086" y="171" fill="#FF9A87">MCP</text>
  </g>
  <circle cx="939" cy="166" r="25" fill="#18243A" stroke="#5BD8F5" stroke-width="2"/>
  <circle cx="939" cy="166" r="8" fill="url(#accent)"/>
  <circle cx="939" cy="166" r="3" fill="#FFFFFF"/>
</svg>
